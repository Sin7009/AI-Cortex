[project]
name = "ai-cortex"
version = "0.1.0"
description = "AI-Assistant for Executive Communication - интеллектуальная система премодерации и улучшения контента"
authors = [
    { name = "Sin7009", email = "sin7009@example.com" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "aiogram>=3.2.0",
    "chromadb",
    "pypdf",
    "python-docx",
    "python-dotenv",
    "langchain",
    "lark",
    "tiktoken",
    "langchain-ollama",
    "langchain-openai",
    "langchain-huggingface",
    "sentence-transformers",
]

[project.optional-dependencies]
# Для GigaChat API (внешний)
gigachat = [
    "langchain-gigachat",
]

# Квантизация для экономии памяти
quantization = [
    "bitsandbytes>=0.41.0",
]

# Все опциональные зависимости
all = [
    "ai-cortex[gigachat,quantization]",
]

[project.urls]
Homepage = "https://github.com/Sin7009/AI-Cortex"
Repository = "https://github.com/Sin7009/AI-Cortex"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = []

[tool.hatch.build.targets.wheel]
packages = ["."]
